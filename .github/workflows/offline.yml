name: Offline reproducibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -q
      - run: python -B scripts/check_public.py
      - run: python -B scripts/public_audit.py
      - run: python -B scripts/analyze.py --output reports/generated
